---
# playbooks/prod-sync-reset-passwords.yml
# PROD sync row 2.10 (STOP S2). After the ZFS copy, PROD's stores carry DEV's
# passwords. This sets them to the PROD vault values. Run ONCE, only on
# Roman's ruling, only against colossus-prod-db1. No value is logged.
# Semaphore template: "PROD Sync - Reset Passwords" (limit: colossus-prod-db1)
- name: "PROD sync — reset PROD store passwords to PROD vault values"
  hosts: colossus-prod-db1
  become: true
  gather_facts: false
  tasks:
    - name: "Refuse to run anywhere but colossus-prod-db1"
      ansible.builtin.assert:
        that: inventory_hostname == 'colossus-prod-db1'
        fail_msg: "This playbook runs only on colossus-prod-db1."

    - name: "Postgres: set role postgres password to the PROD vault value"
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - colossus-postgres
          - psql
          - -U
          - postgres
          - -v
          - ON_ERROR_STOP=1
          - -c
          - "ALTER ROLE postgres PASSWORD '{{ vault_colossus_legal_pg_password_prod }}'"
      no_log: true
      changed_when: true

    - name: "Neo4j: change neo4j user password from the DEV value to the PROD value"
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - colossus-neo4j
          - cypher-shell
          - -d
          - system
          - -u
          - neo4j
          - -p
          - "{{ vault_colossus_legal_neo4j_password_dev }}"
          - "ALTER CURRENT USER SET PASSWORD FROM '{{ vault_colossus_legal_neo4j_password_dev }}' TO '{{ vault_colossus_legal_neo4j_password_prod }}'"
      no_log: true
      changed_when: true

    - name: "Done"
      ansible.builtin.debug:
        msg: "PROD store passwords now match the PROD vault. Next: Semaphore deploy of colossus-legal v2.1.2 to PROD."
