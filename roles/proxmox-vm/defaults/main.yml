---
# proxmox-vm role defaults
# Override per-VM via extra vars or a vars file

# ── VM identity ──────────────────────────────────────────────
# vm_id:          (required) Proxmox VMID
# vm_name:        (required) VM hostname
# vm_ignition:    (required when vm_provision == "coreos") Ignition filename in snippets dir
# vm_cloudinit_vendordata: (required when vm_provision == "fedora") cloud-init vendor-data filename in snippets dir

# ── Provisioning mode ────────────────────────────────────────
# coreos (default): Fedora CoreOS via Ignition (cicustom vendor= slot)
# fedora:           Fedora Server via cloud-init user-data (cicustom user= slot)
# Existing CoreOS VMs are unaffected — leave this unset to keep coreos behavior.
vm_provision: coreos

# ── Hardware ─────────────────────────────────────────────────
vm_cores: 4
vm_memory: 16384
vm_disk_grow: "+40G"
vm_machine: q35
vm_bridge: vmbr0
vm_scsihw: virtio-scsi-pci

# Relative CPU weight under contention (Proxmox cpuunits, default 100).
# Lower yields to higher-weighted VMs. Left at 100 → task is skipped, so
# existing VMs are never touched.
vm_cpuunits: 100

# Guest CPU model.
#
# Proxmox's own default for `qm create` is kvm64 — an x86-64-v1 model with no
# SSE4.2, POPCNT, SSSE3 or AES. Modern software increasingly treats x86-64-v2 as
# a hard floor (NumPy >= 2.0 wheels, many ONNX builds), and on kvm64 it dies at
# import with an illegal instruction. That presents as random application
# errors rather than as a CPU problem, which is what made it expensive to find
# on VM-130.
#
# x86-64-v2-AES is a NAMED model, deliberately not `host`. The three nodes are
# different vendors — pve-1 Intel Arrow Lake, pve-2 AMD Zen 3, pve-3 Intel
# Raptor Lake — so `host` pins a VM to the node it was built on and it will not
# start elsewhere. All three clear v2 plus AES-NI, so this model starts anywhere
# in the fleet. All three also clear v3, but nothing needs AVX2 and raising the
# floor would constrain any node added later.
#
# Per-VM overrides:
#   host        node-pinned VM that wants every host feature
#   x86-64-v3   AVX2 workloads
#   ""          skip the task entirely, leaving Proxmox's kvm64 default
#
# Applied at creation only — the whole create block is guarded by
# `when: vm_exists.rc != 0`, so the role never reconfigures a running VM.
vm_cpu_type: x86-64-v2-AES

# ── Storage ──────────────────────────────────────────────────
vm_storage: local-lvm
vm_coreos_store_id: coreos
vm_coreos_store_path: /var/coreos
vm_coreos_snippets_dir: "{{ vm_coreos_store_path }}/snippets"
vm_coreos_images_dir: "{{ vm_coreos_store_path }}/images"

# ── Fedora cloud-init (vm_provision == "fedora") ─────────────
# cloud-init VENDOR-data filename, placed in the same snippets dir as ignition.
# (The user slot would make Proxmox skip hostname/network — see tasks/main.yml.)
vm_cloudinit_vendordata: ""
# Proxmox-native identity: user + SSH public keys (vendor-data ignores users:).
# vm_sshkeys_file is a filename under the repo's cloud-init/ dir; the role
# copies it to the host snippets dir and points --sshkeys at it.
vm_ciuser: ""
vm_sshkeys_file: ""
# Static networking, applied via Proxmox-native cloud-init (ipconfig0 +
# nameserver). All three required when vm_provision == "fedora". CoreOS
# ignores these — Ignition owns its own network.
vm_ip: ""          # e.g. "10.10.100.230/24"
vm_gateway: ""     # e.g. "10.10.100.1"
vm_nameserver: ""  # e.g. "10.10.100.53"
# Reuse the same images dir as CoreOS for now (moves to pve-4 later).
vm_fedora_images_dir: "{{ vm_coreos_images_dir }}"
# NOTE: Fedora 44 renamed its cloud image — there is NO "Fedora-Server-KVM-*".
# The real cloud-init qcow2 is "Fedora-Server-Guest-Generic-44-1.7.x86_64.qcow2".
# This default glob is kept per spec; override in the per-VM vars file (or here)
# to match the file actually downloaded. See the image-not-found fail message.
vm_fedora_image_glob: "Fedora-Server-KVM-*.x86_64.qcow2"

# ── virtiofs shares (optional) ───────────────────────────────
# List of dicts: [{dirid: "prod-db-postgres", cache: "always"}, ...]
# Leave empty for VMs that don't need virtiofs (e.g., app VMs).
vm_virtiofs_shares: []

# ── QEMU guest agent ─────────────────────────────────────────
# Set true to enable the virtio-serial guest-agent device (--agent enabled=1).
# Required for qemu-guest-agent to start inside the guest. Off by default so
# existing CoreOS VMs (which never set this) stay byte-identical.
vm_agent_enabled: false

# Start this VM automatically when the Proxmox host boots (Proxmox `onboot`).
#
# Closes D-9. The role never set this, so every VM in the fleet had it applied by
# hand afterwards — and the manual step is easy to forget, which is why the
# CoreOS runbook carried "qm set <id> --onboot 1" as a separate instruction.
#
# Defaults to 1 because that is what the fleet actually does: 9 of 10 VMs run
# onboot=1, the exception being one stopped legacy VM. Proxmox's own `qm create`
# default is 0, so this deliberately diverges from Proxmox to match house
# practice. Set vm_onboot: 0 for a VM that should stay down across a host reboot.
#
# Distinct from vm_auto_start below: this controls HOST BOOT behaviour, not
# whether the role powers the VM on at creation time.
vm_onboot: 1

# ── Post-creation ────────────────────────────────────────────
# Whether the role powers the VM on immediately after creating it.
# Deliberately false: a freshly created VM may carry another VM's static IP or
# virtiofs mounts until its config is confirmed, so starting is always a separate,
# deliberate act.
vm_auto_start: false
