---
# Traefik (CT-313) -- route definitions
#
# This is the single source of truth for all Traefik routes.
# The traefik-route role templates /etc/traefik/dynamic/services.yml
# from this list. If a route isn't here, it won't exist on disk.
#
# Route properties:
#   name:        (required) Unique router/service identifier
#   host:        (required) FQDN for the Host() match rule
#   backend_url: (required*) Backend service URL
#   service:     (required*) Built-in service override (e.g., api@internal)
#   external:    (optional) true = create HTTP router for Cloudflare Tunnel
#   protected:   (optional) true = apply ForwardAuth middleware
#
#   * Exactly one of backend_url or service must be specified.

# -- Authentication Middleware ------------------------------------------------
# ForwardAuth middleware for Authentik. When enabled, routes with
# protected: true require authentication before Traefik forwards
# to the backend service.
#
# Emergency override: set enabled: false to bypass auth globally
# and restore direct access to all services.
traefik_auth:
  enabled: true
  name: "authentik"
  address: "http://10.10.100.58:9000/outpost.goauthentik.io/auth/traefik"
  response_headers:
    - "X-authentik-username"
    - "X-authentik-groups"
    - "X-authentik-entitlements"
    - "X-authentik-email"
    - "X-authentik-name"
    - "X-authentik-uid"
    - "X-authentik-jwt"
    - "X-authentik-meta-jwks"
    - "X-authentik-meta-outpost"
    - "X-authentik-meta-provider"
    - "X-authentik-meta-app"
    - "X-authentik-meta-version"

# -- Authentik Portal Route ---------------------------------------------------
# The auth portal itself and the outpost callback path.
# These are special routes rendered by the template separately.
traefik_auth_portal:
  host: "auth.{{ domain }}"
  backend_url: "http://10.10.100.58:9000"

# -- Application Routes -------------------------------------------------------
traefik_routes:
  # -- Colossus-Legal PROD --
  - name: colossus-legal-frontend
    host: "colossus-legal.{{ domain }}"
    backend_url: "http://10.10.100.120:5473"
    external: true
    protected: true

  - name: colossus-legal-api
    host: "colossus-legal-api.{{ domain }}"
    backend_url: "http://10.10.100.120:3403"
    external: true
    protected: true

  # -- Colossus-Legal DEV --
  - name: colossus-legal-dev
    host: "colossus-legal-dev.{{ domain }}"
    backend_url: "http://10.10.100.220:5473"
    external: true
    protected: true

  - name: colossus-legal-api-dev
    host: "colossus-legal-api-dev.{{ domain }}"
    backend_url: "http://10.10.100.220:3403"
    external: true
    protected: true

  # -- Infrastructure --
  - name: traefik-dashboard
    host: "traefik.{{ domain }}"
    service: "api@internal"
    external: false
    protected: true

  - name: semaphore
    host: "semaphore.{{ domain }}"
    backend_url: "http://10.10.100.57:3000"
    external: false
    protected: true

  # -- Monitoring --
  - name: observe
    host: "observe.{{ domain }}"
    backend_url: "http://10.10.100.56:8090"
    external: false
    protected: false

  # -- Paperless document store (VM-130 docs1) --
  # protected: false is DELIBERATE, not an oversight. Paperless authenticates
  # against Authentik itself via OIDC. ForwardAuth here would mean two logins
  # for one session, and header trust is meaningless anyway while port 8000 is
  # directly reachable on the LAN.
  #
  # external: true (P-50) publishes this through the Cloudflare tunnel. The
  # tunnel ingress is a per-hostname list — there is no wildcard — so this also
  # requires a public hostname entry in the Zero Trust dashboard plus a proxied
  # CNAME to <tunnel-id>.cfargotunnel.com.
  #
  # TLS needs nothing extra: every HTTPS router this template emits carries the
  # *.cogmai.com wildcard certificate. The HTTP router carries none, correctly —
  # TLS terminates at Cloudflare and the tunnel speaks plain HTTP to :80.
  #
  # ── external_deny_rule ────────────────────────────────────────────────
  # Because protected: false, an unauthenticated request from the internet
  # reaches Paperless itself — including its LOCAL login endpoints, which
  # bypass Authentik entirely. The local `roman` superuser is break-glass and
  # must keep working on the LAN, but it should not be a credential anyone on
  # the internet can submit against.
  #
  # All external traffic arrives on the `http` entrypoint (cloudflared ->
  # 10.10.100.55:80); LAN browsers arrive on `https`. So denying these POSTs on
  # `http` only closes the local door to the internet and leaves LAN break-glass
  # untouched.
  #
  # The four paths were enumerated from paperless/urls.py and probed live —
  # every one accepts a username/password POST:
  #   /accounts/login/                        the login form (CSRF-gated)
  #   /api/auth/login/                        same allauth view, mounted under api/
  #   /api/token/                             DRF obtain-auth-token — NOT CSRF-gated,
  #                                           returns a long-lived API token
  #   /auth/headless/{browser,app}/v1/auth/login   allauth headless JSON login
  #
  # GET is deliberately NOT blocked: the login page must still render so
  # external users can click "Sign in with Authentik". Verified against the live
  # page — the SSO button POSTs to /accounts/oidc/authentik/login/, a different
  # path, so the SSO flow is unaffected.
  - name: docs
    host: "docs.{{ domain }}"
    backend_url: "http://10.10.100.130:8000"
    external: true
    protected: false
    external_deny_rule: >-
      Method(`POST`) && (
      Path(`/accounts/login/`)
      || Path(`/api/auth/login/`)
      || Path(`/api/token/`)
      || PathRegexp(`^/auth/headless/(browser|app)/v[0-9]+/auth/login$`)
      )

# Beszel monitoring agent
beszel_agent_token: "{{ vault_beszel_agent_token_traefik }}"
