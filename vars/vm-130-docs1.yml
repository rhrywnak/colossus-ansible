---
# VM-130: docs1 — Paperless-ngx canonical document store (pve-1)
# Run via SEMAPHORE (infra control node), not build1:
#   playbooks/create-vm.yml -e @vars/vm-130-docs1.yml --limit pve-1
#
# Butane config: ~/Projects/colossus-homelab/butane/docs1.bu
# Spec:          DOCUMENTS/DESIGN/COLOSSUS_PAPERLESS_INFRASTRUCTURE_SPEC_v1.md
#
# NO virtiofs: storage comes from TrueNAS over NFSv4 (exports 13 and 14, both
# pinned to 10.10.100.130). Static IP is set in Butane/Ignition — CoreOS owns
# its own network config.
#
# Sizing rationale: 4 vCPU because OCR is CPU-bound (Tesseract; no GPU path
# exists in Paperless). 6 GB RAM covers the Tika JVM plus OCR bursts. Disk is
# local application state only (SQLite + tantivy index) plus four container
# images (~2 GB); the documents themselves live on TrueNAS.
#
# CPU contention: pve-1 also runs colossus-legal PROD (VM-120) and build1
# (VM-230). Those are SEPARATE VMs, so a systemd CPUWeight= inside VM-130
# cannot influence them — it only ranks Paperless's own containers against one
# another. The lever that works at this layer is Proxmox cpuunits, set below:
# 50 against their default 100, so PROD and build1 win contention 2:1.
# OCR taking longer is invisible; PROD slowing down is not.
vm_id: 130
vm_name: docs1
vm_ignition: docs1.ign
vm_cores: 4
vm_memory: 6144
vm_disk_grow: "+30G"
vm_storage: local-lvm
vm_cpuunits: 50

# Start on host boot. Matches live (onboot: 1). Expressible only since
# roles/proxmox-vm gained vm_onboot support (D-9) — the deployment runbook's
# manual "qm set 130 --onboot 1" step is now obsolete and should be dropped from
# the rebuild loop.
vm_onboot: 1

# Guest CPU model. MUST be v2-or-better: the Paperless image's NumPy requires
# x86-64-v2, and on Proxmox's kvm64 default it dies at import with an illegal
# instruction — which surfaced as random ingest failures, not as a CPU fault.
#
# `host` matches what VM-130 is running now (applied by hand 2026-08-15), so a
# rebuild reproduces the proven-good state exactly rather than substituting an
# untested model. The cost is that docs1 can only start on pve-1 — acceptable,
# because both TrueNAS NFS exports (13 and 14) are pinned to this VM's IP and it
# has no migration story. x86-64-v2-AES would also satisfy NumPy and would keep
# the VM portable, if that ever matters more than matching what is running.
vm_cpu_type: host

vm_virtiofs_shares: []
